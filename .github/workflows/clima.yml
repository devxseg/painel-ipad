name: Atualizar previsão do tempo

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/clima.yml"]

permissions:
  contents: write

concurrency:
  group: clima
  cancel-in-progress: false

jobs:
  clima:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar previsão de Fortaleza (Open-Meteo)
        run: |
          curl -fsS --retry 3 -o weather.tmp "https://api.open-meteo.com/v1/forecast?latitude=-3.7319&longitude=-38.5267&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,weather_code,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max,sunrise,sunset&timezone=America%2FFortaleza&forecast_days=2"
          python3 -c "import json; json.load(open('weather.tmp'))"
          mv weather.tmp weather.json
      - name: Salvar
        run: |
          git config user.name "clima-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          git diff --cached --quiet || git commit -m "Atualiza previsão do tempo"
          git push
